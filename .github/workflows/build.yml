name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 解压并找到项目目录
        id: proj
        run: |
          echo "仓库根目录的文件："
          ls -la

          # 项目文件还没解开（仓库里只有 zip）时，先把根目录下的 zip 解压到 _src/
          if [ -z "$(find . -maxdepth 6 -path '*/app/build.gradle.kts' -not -path './.git/*' | head -n 1)" ]; then
            ZIPS=$(find . -maxdepth 1 -name '*.zip')
            if [ -z "$ZIPS" ]; then
              echo "::error::仓库里既没有项目文件，也没有 zip 压缩包"
              exit 1
            fi
            mkdir -p _src
            for z in $ZIPS; do
              echo "解压 $z"
              unzip -q -o "$z" -d _src
            done
          fi

          # 不管项目放在哪一层，只要找到 app/build.gradle.kts 就认定它的上两级是项目根目录
          APPFILE=$(find . -maxdepth 6 -path '*/app/build.gradle.kts' -not -path './.git/*' | head -n 1)
          if [ -z "$APPFILE" ]; then
            echo "::error::找不到 app/build.gradle.kts，zip 里的项目文件不完整"
            find . -maxdepth 4 -not -path './.git/*' | sort | head -n 80
            exit 1
          fi
          DIR=$(dirname "$(dirname "$APPFILE")")
          echo "项目目录：$DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

          if [ -f "$DIR/gradlew" ] && [ -f "$DIR/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "use_wrapper=true" >> "$GITHUB_OUTPUT"
          else
            echo "没找到完整的 gradlew，改用 Gradle 9.1.0 直接编译"
            echo "use_wrapper=false" >> "$GITHUB_OUTPUT"
          fi

          if [ ! -f "$DIR/keystore/lingxi.jks" ]; then
            echo "::error::缺少 keystore/lingxi.jks（签名文件）"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.proj.outputs.use_wrapper == 'true' && 'wrapper' || '9.1.0' }}

      - name: 编译 APK
        working-directory: ${{ steps.proj.outputs.dir }}
        env:
          USE_WRAPPER: ${{ steps.proj.outputs.use_wrapper }}
        run: |
          if [ "$USE_WRAPPER" = "true" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease --stacktrace --no-daemon
          else
            gradle assembleRelease --stacktrace --no-daemon
          fi

      - name: 整理 APK
        id: apk
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts || echo dev)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$APK" "$GITHUB_WORKSPACE/out/lingxi-dia-$VER-${GITHUB_RUN_NUMBER}.apk"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          ls -la "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: lingxi-dia-apk
          path: out/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.ver }}-${{ github.run_number }}
          name: 灵犀 Dia ${{ steps.apk.outputs.ver }}（第 ${{ github.run_number }} 次构建）
          body: 自动构建。手机上点下面的 .apk 下载安装（签名固定，可直接覆盖升级）。
          files: out/*.apk
